name: Build pstar Kernel CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build_kernel:
    name: Build Android Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm8250
          ref: lineage-23.0

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: zipper
          fetch-depth: 1

      - name: Create Composite Defconfig
        run: |
          cat arch/arm64/configs/vendor/kona-perf_defconfig \
              arch/arm64/configs/vendor/ext_config/moto-kona.config \
              arch/arm64/configs/vendor/ext_config/pstar-default.config \
              arch/arm64/configs/vendor/debugfs.config > arch/arm64/configs/vendor/lineageos_pstar_defconfig
          echo "Successfully created composite defconfig!"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ hashFiles('**/lineageos_pstar_defconfig') }}

      - name: Build Kernel
        id: kernel_build
        run: |
          uses: lemniskett/android-kernel-actions@master
          id: build
          env:
            EXTRA_CMDS: "LLVM=1 LLVM_IAS=1"
            NAME: "Pstar-Kernel"
          with:
            arch: arm64
            compiler: aosp-clang/android12-release/clang-r416183b1/binutils
            defconfig: vendor/lineageos_pstar_defconfig
            image: Image
          2>&1 | tee build.log

      - name: Send Success Notification
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: |
            ✅ *pstar 内核编译成功!*
            
            *分支*: `${{ github.ref_name }}`
            *耗时*: `${{ steps.kernel_build.outputs.elapsed_time }} 秒`
            *提交*: `${{ github.sha }}`
          document: ${{ steps.kernel_build.outputs.outfile }}
          format: markdown

      - name: Send Failure Notification and Logs
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *pstar 内核编译失败!*
            
            *分支*: `${{ github.ref_name }}`
            *请检查 Actions 日志获取详细信息。*
          # 将包含完整错误信息的日志文件作为文档发送
          document: build.log
          format: markdown
