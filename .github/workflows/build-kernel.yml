name: Build pstar Kernel CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build_kernel:
    name: Build Android Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          # 1. 内核源码信息
          kernel-url: https://github.com/LineageOS/android_kernel_motorola_sm8250
          kernel-branch: lineage-23.0

          config: vendor/ext_config/pstar-default.config
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r416183b1
          anykernel3: true
          release: false # 成功后可以改为 true
          access-token: ${{ secrets.GITHUB_TOKEN }}
          ccache: true
          disable-lto: true
