name: Build pstar Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build pstar Kernel
    runs-on: ubuntu-20.04
    steps:
      - name: Set Build Variables
        run: |
          echo "KERNEL_SOURCE=https://github.com/LineageOS/android_kernel_motorola_sm8250" >> $GITHUB_ENV
          echo "KERNEL_SOURCE_BRANCH=lineage-23.0" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "DEFCONFIG_PATH=arch/arm64/configs/vendor/lineageos_pstar_defconfig" >> $GITHUB_ENV

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl \
            flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            unzip wget zip zlib1g-dev python2
          mkdir -p $GITHUB_WORKSPACE/toolchains
          mkdir -p $GITHUB_WORKSPACE/kernel_source

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE/toolchains
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r383902b.git clang

      - name: Download Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm8250
          ref: lineage-23.0
          path: kernel_source

      - name: Generate Defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel_source
          cat arch/arm64/configs/vendor/kona-perf_defconfig \
              arch/arm64/configs/vendor/ext_config/moto-kona.config \
              arch/arm64/configs/vendor/ext_config/pstar-default.config \
              arch/arm64/configs/vendor/debugfs.config > ${{ env.DEFCONFIG_PATH }}

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_source
          export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc-arm64/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/toolchains/clang/lib64:$LD_LIBRARY_PATH
          
          make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG_PATH }}
          make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang olddefconfig
          make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang

      - name: Package with AnyKernel3
        if: success()
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp kernel_source/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 Pstar-Kernel-$(date +%Y%m%d-%H%M).zip .
        
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pstar-kernel
          path: AnyKernel3/Pstar-Kernel-*.zip
      
      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅ *pstar 内核编译成功!*' || '❌ *pstar 内核编译失败!*' }}
            
            *拯救机械生命的行动已完成。请检查结果。*
            *链接*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          format: markdown
          disable_web_page_preview: true
