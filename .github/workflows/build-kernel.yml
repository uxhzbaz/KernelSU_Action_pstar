name: Build pstar Kernel CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build_kernel:
    name: Build Android Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm8250
          ref: lineage-23.0

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: zipper
          fetch-depth: 1

      - name: Create Composite Defconfig
        run: |
          cat arch/arm64/configs/vendor/kona-perf_defconfig \
              arch/arm64/configs/vendor/ext_config/moto-kona.config \
              arch/arm64/configs/vendor/ext_config/pstar-default.config \
              arch/arm64/configs/vendor/debugfs.config > arch/arm64/configs/vendor/lineageos_pstar_defconfig
          echo "Successfully created composite defconfig!"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ hashFiles('**/lineageos_pstar_defconfig') }}

      - name: Build Kernel
        id: kernel_build
        # 核心修正 1：回到我们最初使用的、确认存在的 Action
        uses: lemniskett/android-kernel-actions@master
        env:
          NAME: "Pstar-Kernel"
          # 增加一个保险的环境变量，在某些内核上可以避免警告被视为错误
          EXTRA_CMDS: "KCFLAGS=-Wno-error"
        with:
          arch: arm64
          # 核心修正 2：使用 Proton Clang 的稳定版本 13.0.0，这是解决 Segmentation Fault 的关键
          compiler: proton-clang/13.0.0/binutils
          defconfig: vendor/lineageos_pstar_defconfig
          image: Image

      - name: Send Kernel on Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHANNEL_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: |
            ✅ *pstar 内核编译成功!*
            
            *分支*: `${{ github.ref_name }}`
            *耗时*: `${{ steps.kernel_build.outputs.elapsed_time }} 秒`
            *提交*: `${{ github.sha }}`
          document: ${{ steps.kernel_build.outputs.outfile }}
          format: markdown

      - name: Send Failure Log on Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHANNEL_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: |
            ❌ *pstar 内核编译失败!*
            
            *分支*: `${{ github.ref_name }}`
            *请检查详细日志*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          format: markdown

      - name: Upload Kernel as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pstar-kernel-zip
          path: ${{ steps.kernel_build.outputs.outfile }}
