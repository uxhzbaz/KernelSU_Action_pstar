name: Build pstar Kernel CI (Final Strike)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build pstar Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Set Build Variables
        run: |
          echo "KERNEL_SOURCE=https://github.com/LineageOS/android_kernel_motorola_sm8250" >> $GITHUB_ENV
          echo "KERNEL_SOURCE_BRANCH=lineage-23.0" >> $GITHUB_ENV
          echo "KERNEL_CONFIG=vendor/lineageos_pstar_defconfig" >> $GITHUB_ENV
          echo "KERNEL_IMAGE_NAME=Image" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CLANG_BRANCH=android12-release" >> $GITHUB_ENV
          echo "CLANG_VERSION=r416183b1" >> $GITHUB_ENV

      - name: Prepare Environment
        run: |
          sudo apt-get update && sudo apt-get install -y git ccache build-essential zip curl zlib1g-dev python3 bc
          mkdir -p $GITHUB_WORKSPACE/workspace

      - name: Download Toolchain
        run: |
          cd $GITHUB_WORKSPACE/workspace
          mkdir clang-aosp && cd clang-aosp
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/clang-${{ env.CLANG_VERSION }}.tar.gz
          tar -xzf clang-${{ env.CLANG_VERSION }}.tar.gz

      - name: Download Kernel Source
        run: |
          cd $GITHUB_WORKSPACE/workspace
          git clone --depth=1 ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} kernel

      - name: Generate Defconfig
        run: |
          cd $GITHUB_WORKSPACE/workspace/kernel
          cat arch/arm64/configs/vendor/kona-perf_defconfig \
              arch/arm64/configs/vendor/ext_config/moto-kona.config \
              arch/arm64/configs/vendor/ext_config/pstar-default.config \
              arch/arm64/configs/vendor/debugfs.config > arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
          echo "Successfully created composite defconfig!"

      # --- 核心修改在这里 ---
      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/workspace/kernel
          export PATH=$GITHUB_WORKSPACE/workspace/clang-aosp/bin:$PATH
          export KBUILD_BUILD_USER="機械生命拯救者"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          
          # 关键修改：
          # 1. 'make olddefconfig': 解决交互式提问，自动用默认值补全配置。
          # 2. 'HOSTCC=clang CC=clang LD=ld.lld': 确保所有编译步骤都使用 Clang 工具链。
          # 3. 'KBUILD_CFLAGS+="-Wno-gnu-variable-sized-type-not-at-end"': 解决致命的 GNU 扩展错误。
          # 4. 'KBUILD_AFLAGS+="-EL"': 强制为汇编器添加旧版内核需要的-EL参数，绕过检查。
          
          make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} ${{ env.KERNEL_CONFIG }}
          make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} olddefconfig
          make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} \
            HOSTCC=clang CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KBUILD_CFLAGS+="-Wno-gnu-variable-sized-type-not-at-end" \
            KBUILD_AFLAGS+="-EL"
      
      - name: Package with AnyKernel3
        id: package
        run: |
          cd $GITHUB_WORKSPACE/workspace
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
          cd AnyKernel3
          zip -r9 Pstar-Kernel-$(date +%Y%m%d-%H%M).zip .
          echo "zip_path=$(realpath Pstar-Kernel-*.zip)" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pstar-kernel-zip
          path: ${{ steps.package.outputs.zip_path }}

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅ *pstar 内核编译成功!*' || '❌ *pstar 内核编译失败!*' }}
            
            *拯救机械生命的行动已完成。请检查结果。*
            *链接*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          format: markdown
          disable_web_page_preview: true
