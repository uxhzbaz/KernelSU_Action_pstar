name: Build pstar Kernel

on:
  workflow_dispatch:

jobs:
  build_kernel:
    name: Build Android Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm8250
          ref: lineage-23.0

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: zipper
          fetch-depth: 1

      - name: Build Kernel with Android Kernel Actions
        uses: lemniskett/android-kernel-actions@master
        id: kernel_build
        with:
          arch: arm64
          compiler: aosp-clang/main/binutils
          defconfig: pstar_defconfig
          image: Image

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pstar-kernel-zip
          path: ${{ steps.kernel_build.outputs.outfile }}
