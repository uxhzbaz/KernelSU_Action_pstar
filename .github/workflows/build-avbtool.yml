name: 构建 AVB 工具

on:
  workflow_dispatch:  # 只支持手动触发
  push:
    branches:
      - main

env:
  AVB_VERSION: "android-16.0.0_r3"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: 检出仓库代码
      uses: actions/checkout@v4

    # 2. 安装系统依赖
    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3 \
          python3-pip \
          clang \
          g++ \
          cmake \
          pkg-config \
          libssl-dev \
          libfmt-dev \
          libgtest-dev \
          libgmock-dev

    # 3. 克隆 AVB 源码
    - name: 克隆 AVB 源码
      run: |
        git clone https://android.googlesource.com/platform/external/avb
        cd avb
        git checkout ${{ env.AVB_VERSION }}
        echo "AVB源码版本: ${{ env.AVB_VERSION }}"

    # 4. 编译 libavb 库
    - name: 编译 libavb 库
      run: |
        cd avb
        
        # 创建 libavb 头文件目录结构
        mkdir -p libavb/include/libavb
        cp libavb/*.h libavb/include/libavb/ 2>/dev/null || true
        
        # 编译 libavb 静态库
        mkdir -p build/libavb
        cd build/libavb
        
        # 编译必要的源文件
        gcc -c -I../../libavb -std=gnu99 ../../libavb/avb_sha256.c -o avb_sha256.o
        gcc -c -I../../libavb -std=gnu99 ../../libavb/avb_rsa.c -o avb_rsa.o
        gcc -c -I../../libavb -std=gnu99 ../../libavb/avb_util.c -o avb_util.o
        gcc -c -I../../libavb -std=gnu99 ../../libavb/avb_crc32.c -o avb_crc32.o
        gcc -c -I../../libavb -std=gnu99 ../../libavb/avb_crypto.c -o avb_crypto.o
        gcc -c -I../../libavb -std=gnu99 ../../libavb/avb_sysdeps_posix.c -o avb_sysdeps_posix.o
        
        # 创建静态库
        ar rcs libavb.a avb_sha256.o avb_rsa.o avb_util.o avb_crc32.o avb_crypto.o avb_sysdeps_posix.o
        
        # 复制到安装目录
        mkdir -p ../../install/lib
        mkdir -p ../../install/include/libavb
        cp libavb.a ../../install/lib/
        cp ../../libavb/*.h ../../install/include/libavb/ 2>/dev/null || true
        
        echo "libavb 库编译完成"

    # 5. 创建 Android base 替代头文件
    - name: 创建 Android base 头文件
      run: |
        cd avb
        
        # 创建 android-base 替代头文件
        mkdir -p install/include/android-base
        cat > install/include/android-base/properties.h << 'EOF'
        #ifndef ANDROID_BASE_PROPERTIES_H
        #define ANDROID_BASE_PROPERTIES_H
        
        #include <string>
        
        namespace android {
        namespace base {
        
        std::string GetProperty(const std::string& key, const std::string& default_value);
        bool GetBoolProperty(const std::string& key, bool default_value);
        int GetIntProperty(const std::string& key, int default_value);
        
        }  // namespace base
        }  // namespace android
        
        #endif  // ANDROID_BASE_PROPERTIES_H
        EOF
        
        # 创建实现文件
        cat > install/include/android-base/properties.cpp << 'EOF'
        #include "properties.h"
        #include <cstdlib>
        #include <cstring>
        
        namespace android {
        namespace base {
        
        std::string GetProperty(const std::string& key, const std::string& default_value) {
            // 简化实现：返回默认值
            return default_value;
        }
        
        bool GetBoolProperty(const std::string& key, bool default_value) {
            return default_value;
        }
        
        int GetIntProperty(const std::string& key, int default_value) {
            return default_value;
        }
        
        }  // namespace base
        }  // namespace android
        EOF

    # 6. 编译 avbtool (Python 工具)
    - name: 编译 avbtool
      run: |
        cd avb
        
        # 检查 avbtool 是否存在
        if [ -f "avbtool.py" ]; then
          echo "找到 avbtool.py"
          
          # 安装 Python 依赖
          pip3 install cryptography
          
          # 测试 avbtool 是否正常工作
          python3 avbtool.py --version || echo "avbtool 版本检查跳过"
          
          # 创建输出目录
          mkdir -p ../output/bin
          cp avbtool.py ../output/bin/
          chmod +x ../output/bin/avbtool.py
          
          # 创建可直接执行的avbtool
          echo '#!/usr/bin/env python3' > ../output/bin/avbtool
          cat avbtool.py >> ../output/bin/avbtool
          chmod +x ../output/bin/avbtool
          
          echo "avbtool 编译完成"
        else
          echo "错误: 未找到 avbtool.py"
          exit 1
        fi

    # 7. 修复 avbctl 编译 - 简化版本
    - name: 编译 avbctl
      continue-on-error: true
      run: |
        cd avb
        
        # 检查 avbctl 源码是否存在
        if [ -f "tools/avbctl/avbctl.cc" ]; then
          echo "找到 avbctl 源码"
          
          # 创建简化的 avb_ops_user.h
          mkdir -p install/include/libavb_user
          cat > install/include/libavb_user/avb_ops_user.h << 'EOF'
          #ifndef AVB_OPS_USER_H_
          #define AVB_OPS_USER_H_
          
          #include <libavb/libavb.h>
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          AvbOps* avb_ops_user_new(void);
          void avb_ops_user_free(AvbOps* ops);
          
          #ifdef __cplusplus
          }
          #endif
          
          #endif  // AVB_OPS_USER_H_
          EOF
          
          # 创建简化的头文件
          cat > install/include/libavb_user/avb_user_verification.h << 'EOF'
          #ifndef AVB_USER_VERIFICATION_H_
          #define AVB_USER_VERIFICATION_H_
          
          #include <libavb/libavb.h>
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          bool avb_user_verification_get(AvbOps* ops,
                                         const char* ab_suffix,
                                         bool* out_enabled);
          bool avb_user_verification_set(AvbOps* ops,
                                         const char* ab_suffix,
                                         bool enable);
          
          #ifdef __cplusplus
          }
          #endif
          
          #endif  // AVB_USER_VERIFICATION_H_
          EOF
          
          cat > install/include/libavb_user/avb_user_verity.h << 'EOF'
          #ifndef AVB_USER_VERITY_H_
          #define AVB_USER_VERITY_H_
          
          #include <libavb/libavb.h>
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          bool avb_user_verity_get(AvbOps* ops,
                                   const char* ab_suffix,
                                   bool* out_enabled);
          bool avb_user_verity_set(AvbOps* ops,
                                   const char* ab_suffix,
                                   bool enable);
          
          #ifdef __cplusplus
          }
          #endif
          
          #endif  // AVB_USER_VERITY_H_
          EOF
          
          # 创建简化的实现文件
          cat > install/libavb_user_stubs.cpp << 'EOF'
          #include "libavb_user/avb_ops_user.h"
          #include "libavb_user/avb_user_verification.h"
          #include "libavb_user/avb_user_verity.h"
          #include <cstdio>
          
          AvbOps* avb_ops_user_new(void) {
              printf("avb_ops_user_new: stub implementation\\n");
              return nullptr;
          }
          
          void avb_ops_user_free(AvbOps* ops) {
              printf("avb_ops_user_free: stub implementation\\n");
          }
          
          bool avb_user_verification_get(AvbOps* ops,
                                         const char* ab_suffix,
                                         bool* out_enabled) {
              printf("avb_user_verification_get: stub implementation\\n");
              *out_enabled = false;
              return true;
          }
          
          bool avb_user_verification_set(AvbOps* ops,
                                         const char* ab_suffix,
                                         bool enable) {
              printf("avb_user_verification_set: stub implementation\\n");
              return true;
          }
          
          bool avb_user_verity_get(AvbOps* ops,
                                   const char* ab_suffix,
                                   bool* out_enabled) {
              printf("avb_user_verity_get: stub implementation\\n");
              *out_enabled = false;
              return true;
          }
          
          bool avb_user_verity_set(AvbOps* ops,
                                   const char* ab_suffix,
                                   bool enable) {
              printf("avb_user_verity_set: stub implementation\\n");
              return true;
          }
          EOF
          
          # 创建构建目录
          mkdir -p build/avbctl
          cd build/avbctl
          
          # 编译 stub 实现
          g++ -c -I../../install/include -std=c++17 ../../install/libavb_user_stubs.cpp -o libavb_user_stubs.o
          
          # 编译 avbctl 主程序（移除 Android 特定依赖）
          g++ -std=c++17 \
            -I../../install/include \
            -I../../install/include/libavb \
            -I../../install/include/libavb_user \
            -I../../install/include/android-base \
            -o avbctl \
            ../../tools/avbctl/avbctl.cc \
            libavb_user_stubs.o \
            ../../install/lib/libavb.a \
            -lssl -lcrypto -lpthread
          
          if [ -f "avbctl" ]; then
            # 复制到输出目录
            mkdir -p ../../output/bin
            cp avbctl ../../output/bin/
            chmod +x ../../output/bin/avbctl
            echo "avbctl 编译成功（使用 stub 实现）"
          else
            echo "警告: avbctl 编译失败"
          fi
        else
          echo "错误: 未找到 avbctl 源码"
        fi

    # 8. 创建最小化的 avbctl（如果上述方法失败）
    - name: 创建最小化 avbctl
      if: failure() && steps.build_avbctl.outcome == 'failure'
      run: |
        cd avb
        
        # 创建最小化的 avbctl 实现
        cat > output/bin/avbctl_minimal << 'EOF'
        #!/bin/bash
        echo "avbctl (minimal stub)"
        echo "This is a minimal implementation for testing purposes"
        echo ""
        echo "Available commands:"
        echo "  get-verity           - Stub: always returns 'disabled'"
        echo "  disable-verity       - Stub: no operation"
        echo "  enable-verity        - Stub: no operation"
        echo "  get-verification     - Stub: always returns 'disabled'"
        echo "  disable-verification - Stub: no operation"
        echo "  enable-verification  - Stub: no operation"
        echo ""
        echo "Note: This is a stub implementation for testing."
        echo "For full functionality, compile in AOSP environment."
        
        case "$1" in
            "get-verity")
                echo "verity is disabled (stub)"
                ;;
            "disable-verity")
                echo "Successfully disabled verity (stub)"
                ;;
            "enable-verity")
                echo "Successfully enabled verity (stub)"
                ;;
            "get-verification")
                echo "verification is disabled (stub)"
                ;;
            "disable-verification")
                echo "Successfully disabled verification (stub)"
                ;;
            "enable-verification")
                echo "Successfully enabled verification (stub)"
                ;;
            *)
                echo "Unknown command: $1"
                exit 1
                ;;
        esac
        EOF
        
        chmod +x output/bin/avbctl_minimal
        # 如果之前的编译失败，使用这个最小化版本
        if [ ! -f "output/bin/avbctl" ]; then
          cp output/bin/avbctl_minimal output/bin/avbctl
          echo "使用最小化 avbctl 实现"
        fi

    # 9. 验证编译结果
    - name: 验证编译结果
      run: |
        echo "编译结果:"
        echo "=========="
        
        if [ -f "output/bin/avbtool" ]; then
          echo "✅ avbtool - 编译成功"
          echo "文件位置: output/bin/avbtool"
          echo "文件大小: $(wc -c < output/bin/avbtool) 字节"
          # 测试基本功能
          echo "测试 avbtool:"
          python3 output/bin/avbtool --version || echo "版本检查失败（预期中）"
        else
          echo "❌ avbtool - 编译失败"
        fi
        
        if [ -f "output/bin/avbctl" ]; then
          echo "✅ avbctl - 编译成功"  
          echo "文件位置: output/bin/avbctl"
          echo "文件大小: $(wc -c < output/bin/avbctl) 字节"
          # 测试基本功能
          echo "测试 avbctl:"
          ./output/bin/avbctl --help || ./output/bin/avbctl get-verity || echo "功能测试失败（预期中）"
        else
          echo "❌ avbctl - 编译失败"
        fi
        
        echo ""
        echo "输出目录内容:"
        find output/ -type f

    # 10. 打包工具
    - name: 打包工具
      run: |
        # 创建版本信息
        DATE_STAMP=$(date +%Y%m%d)
        mkdir -p output/
        
        cat > output/version.txt << EOF
        AVB Tools Build
        Version: ${{ env.AVB_VERSION }}
        Build Date: $(date)
        
        包含的工具:
        - avbtool: $(if [ -f "output/bin/avbtool" ]; then echo "成功"; else echo "失败"; fi)
        - avbctl: $(if [ -f "output/bin/avbctl" ]; then echo "成功（可能为stub实现）"; else echo "失败"; fi)
        
        注意:
        - avbtool: 完整功能的 Python 工具
        - avbctl: 可能使用 stub 实现，在非 AOSP 环境中功能受限
        EOF
        
        # 打包
        tar -czf avb-tools-${{ env.AVB_VERSION }}-${DATE_STAMP}.tar.gz output/
        echo "打包完成: avb-tools-${{ env.AVB_VERSION }}-${DATE_STAMP}.tar.gz"

    # 11. 上传制品
    - name: 上传制品
      uses: actions/upload-artifact@v4
      with:
        name: avb-tools
        path: |
          output/
          avb-tools-*.tar.gz
        retention-days: 30

    # 12. Telegram 通知
    - name: 发送 Telegram 通知
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.CHAT_ID }}
        token: ${{ secrets.BOT_TOKEN }}
        message: |
          ${{ job.status == 'success' && '✅ *AVB 工具编译完成!*' || '❌ *AVB 工具编译失败!*' }}
          
          *版本*: ${{ env.AVB_VERSION }}
          *构建结果*:
          - avbtool: $(if [ -f "output/bin/avbtool" ]; then echo "✅ 成功"; else echo "❌ 失败"; fi)
          - avbctl: $(if [ -f "output/bin/avbctl" ]; then echo "✅ 成功（可能为stub）"; else echo "❌ 失败"; fi)
          
          *工作流链接*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        format: markdown