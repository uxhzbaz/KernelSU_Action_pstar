name: 构建 AVB 工具 (AOSP 环境)

on:
  workflow_dispatch:  # 支持手动触发
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 时间 2 点运行
  push:
    branches:
      - main

env:
  AOSP_BRANCH: "android-14.0.0_r55"  # 使用稳定的 AOSP 版本
  AVB_VERSION: "android-16.0.0_r3"
  BUILD_TARGET: "aosp_x86_64-eng"    # 使用 x86_64 模拟器目标进行主机工具编译

jobs:
  build:
    runs-on: ubuntu-22.04  # 使用 Ubuntu 22.04 以获得更好的 AOSP 兼容性
    timeout-minutes: 180   # 设置 3 小时超时
    
    steps:
    # 1. 检出代码
    - name: 检出仓库代码
      uses: actions/checkout@v4

    # 2. 设置缓存 - 针对 AOSP 编译优化
    - name: 缓存 AOSP 编译环境
      uses: actions/cache@v3
      with:
        path: |
          ~/.ccache
          prebuilts
          .repo
        key: ${{ runner.os }}-aosp-${{ env.AOSP_BRANCH }}-${{ hashFiles('**/repo') }}
        restore-keys: |
          ${{ runner.os }}-aosp-${{ env.AOSP_BRANCH }}-
          ${{ runner.os }}-aosp-

    # 3. 安装 AOSP 编译依赖
    - name: 安装 AOSP 编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-core \
          gnupg \
          flex \
          bison \
          build-essential \
          zip \
          curl \
          zlib1g-dev \
          gcc-multilib \
          g++-multilib \
          libc6-dev-i386 \
          libncurses5 \
          lib32ncurses5-dev \
          x11proto-core-dev \
          libx11-dev \
          lib32z1-dev \
          libgl1-mesa-dev \
          libxml2-utils \
          xsltproc \
          unzip \
          fontconfig \
          python3 \
          python3-pip \
          openjdk-11-jdk \
          ccache \
          lzop \
          imagemagick \
          libssl-dev \
          tmate

        # 设置 ccache
        sudo mkdir -p /usr/local/ccache
        sudo chmod 777 /usr/local/ccache
        export USE_CCACHE=1
        export CCACHE_DIR=/usr/local/ccache
        ccache -M 50G

    # 4. 配置 Git
    - name: 配置 Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global color.ui false

    # 5. 下载 repo 工具
    - name: 下载 repo 工具
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    # 6. 初始化 AOSP 仓库 (最小化同步)
    - name: 初始化 AOSP 仓库
      run: |
        mkdir aosp
        cd aosp
        # 只同步必要的项目来编译 AVB 工具
        repo init -u https://android.googlesource.com/platform/manifest -b ${{ env.AOSP_BRANCH }} --depth=1
        
        # 创建本地清单只同步必要的项目
        mkdir -p .repo/local_manifests
        cat > .repo/local_manifests/avb_only.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project path="external/avb" name="platform/external/avb" />
          <project path="system/core" name="platform/system/core" />
          <project path="system/extras" name="platform/system/extras" />
          <project path="system/libbase" name="platform/system/libbase" />
          <project path="system/logging" name="platform/system/logging" />
          <project path="system/libcutils" name="platform/system/libcutils" />
          <project path="system/libutils" name="platform/system/libutils" />
          <project path="build/make" name="platform/build/make" />
          <project path="prebuilts/build-tools" name="platform/prebuilts/build-tools" />
          <project path="prebuilts/clang/host/linux-x86" name="platform/prebuilts/clang/host/linux-x86" />
          <project path="prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8" name="platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8" />
          <project path="prebuilts/sdk" name="platform/prebuilts/sdk" />
        </manifest>
        EOF

        # 同步项目
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags
        
        echo "AOSP 仓库初始化完成"

    # 7. 切换到特定 AVB 版本
    - name: 切换到 AVB 特定版本
      run: |
        cd aosp/external/avb
        git fetch --tags
        git checkout ${{ env.AVB_VERSION }} || echo "使用默认分支版本"
        cd ../..
        echo "AVB 版本: ${{ env.AVB_VERSION }}"

    # 8. 设置 AOSP 构建环境
    - name: 设置 AOSP 构建环境
      run: |
        cd aosp
        
        # 设置构建环境
        source build/envsetup.sh
        
        # 选择构建目标
        lunch ${{ env.BUILD_TARGET }}
        
        # 设置 ccache
        export USE_CCACHE=1
        export CCACHE_DIR=/usr/local/ccache
        
        # 验证环境
        which make
        which clang
        echo "AOSP 构建环境设置完成"

    # 9. 编译 avbtool (主机工具)
    - name: 编译 avbtool
      run: |
        cd aosp
        source build/envsetup.sh
        lunch ${{ env.BUILD_TARGET }}
        
        # 编译 avbtool 主机工具
        m -j$(nproc) avbtool
        
        echo "avbtool 编译完成"
        
        # 检查输出
        if [ -f "out/host/linux-x86/bin/avbtool" ]; then
          echo "✅ avbtool 编译成功"
          ls -la out/host/linux-x86/bin/avbtool
        else
          echo "❌ avbtool 编译失败"
          exit 1
        fi

    # 10. 编译 avbctl (主机工具)
    - name: 编译 avbctl
      run: |
        cd aosp
        source build/envsetup.sh
        lunch ${{ env.BUILD_TARGET }}
        
        # 编译 avbctl 主机工具
        m -j$(nproc) avbctl
        
        echo "avbctl 编译完成"
        
        # 检查输出
        if [ -f "out/host/linux-x86/bin/avbctl" ]; then
          echo "✅ avbctl 编译成功"
          ls -la out/host/linux-x86/bin/avbctl
        else
          echo "❌ avbctl 编译失败"
          # 尝试查找其他可能的位置
          find out/ -name "avbctl" -type f 2>/dev/null || echo "未找到 avbctl 二进制文件"
          exit 1
        fi

    # 11. 收集编译输出
    - name: 收集编译输出
      run: |
        mkdir -p output/bin
        
        # 复制 avbtool
        if [ -f "aosp/out/host/linux-x86/bin/avbtool" ]; then
          cp aosp/out/host/linux-x86/bin/avbtool output/bin/
          echo "✅ 已复制 avbtool"
        fi
        
        # 复制 avbctl
        if [ -f "aosp/out/host/linux-x86/bin/avbctl" ]; then
          cp aosp/out/host/linux-x86/bin/avbctl output/bin/
          echo "✅ 已复制 avbctl"
        fi
        
        # 检查并复制可能的依赖库
        mkdir -p output/lib
        find aosp/out/host/linux-x86/lib64 -name "*.so" -exec cp {} output/lib/ \; 2>/dev/null || true
        
        # 显示输出内容
        echo "输出目录内容:"
        find output/ -type f

    # 12. 创建版本信息
    - name: 创建版本信息
      run: |
        DATE_STAMP=$(date +%Y%m%d)
        
        cat > output/version.txt << EOF
        AVB Tools - AOSP 环境编译
        =========================
        
        编译信息:
        - AOSP 版本: ${{ env.AOSP_BRANCH }}
        - AVB 版本: ${{ env.AVB_VERSION }}
        - 构建目标: ${{ env.BUILD_TARGET }}
        - 构建日期: $(date -u)
        - 构建 SHA: ${{ github.sha }}
        
        包含工具:
        - avbtool: $(if [ -f "output/bin/avbtool" ]; then echo "✅ 成功"; else echo "❌ 失败"; fi)
        - avbctl: $(if [ -f "output/bin/avbctl" ]; then echo "✅ 成功"; else echo "❌ 失败"; fi)
        
        使用说明:
        这些工具在完整的 AOSP 环境中编译，包含所有必要的依赖库。
        建议在类似的 Linux 环境中使用。
        EOF
        
        # 创建 README
        cat > output/README.md << 'EOF'
        # AVB Tools - AOSP 编译版本
        
        ## 工具说明
        
        ### avbtool
        Android Verified Boot 工具，用于处理 vbmeta 镜像。
        
        **使用方法:**
        ```bash
        ./bin/avbtool --version
        ./bin/avbtool make_vbmeta_image --help
        ```
        
        ### avbctl  
        AVB 控制工具，用于管理设备上的 AVB 设置。
        
        **使用方法:**
        ```bash
        ./bin/avbctl get-verity
        ./bin/avbctl get-verification
        ```
        
        ## 环境要求
        - Linux 环境 (Ubuntu/CentOS 等)
        - 可能需要安装额外的运行时库
        
        ## 编译信息
        此版本在完整的 AOSP 环境中编译，确保工具的功能完整性。
        EOF

    # 13. 打包工具
    - name: 打包工具
      run: |
        DATE_STAMP=$(date +%Y%m%d)
        PACKAGE_NAME="avb-tools-aosp-${{ env.AVB_VERSION }}-${DATE_STAMP}"
        
        # 创建打包目录结构
        mkdir -p packages
        tar -czf packages/${PACKAGE_NAME}.tar.gz output/
        
        # 显示包信息
        echo "打包完成: ${PACKAGE_NAME}.tar.gz"
        ls -la packages/
        
        # 设置输出变量
        echo "PACKAGE_NAME=${PACKAGE_NAME}.tar.gz" >> $GITHUB_OUTPUT
        echo "DATE_STAMP=${DATE_STAMP}" >> $GITHUB_OUTPUT

    # 14. 上传制品
    - name: 上传制品
      uses: actions/upload-artifact@v4
      with:
        name: avb-tools-aosp
        path: |
          output/
          packages/
        retention-days: 30

    # 15. 创建 GitHub Release
    - name: 创建 Release
      if: success()
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: avb-tools-${{ env.AVB_VERSION }}-${{ steps.create_package.outputs.DATE_STAMP }}
        name: AVB Tools ${{ env.AVB_VERSION }} (AOSP Build)
        body: |
          # AVB Tools - AOSP 环境编译版本
          
          ## 编译信息
          - **AOSP 版本**: ${{ env.AOSP_BRANCH }}
          - **AVB 版本**: ${{ env.AVB_VERSION }}
          - **构建日期**: ${{ steps.create_package.outputs.DATE_STAMP }}
          - **构建环境**: Ubuntu 22.04 + 完整 AOSP 环境
          
          ## 包含工具
          - ✅ avbtool - AVB 镜像处理工具
          - ✅ avbctl - AVB 控制工具
          
          ## 使用说明
          这些工具在完整的 AOSP 环境中编译，包含所有必要的依赖。
          解压后请查看 README.md 了解详细使用方法。
        files: packages/avb-tools-aosp-${{ env.AVB_VERSION }}-${{ steps.create_package.outputs.DATE_STAMP }}.tar.gz
        draft: false
        prerelease: false

    # 16. Telegram 通知
    - name: 发送 Telegram 通知
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.CHAT_ID }}
        token: ${{ secrets.TG_BOT_TOKEN }}
        message: |
          ${{ job.status == 'success' && '✅ *AVB 工具 AOSP 编译成功!*' || '❌ *AVB 工具编译失败!*' }}
          
          *版本信息*:
          - AOSP: ${{ env.AOSP_BRANCH }}
          - AVB: ${{ env.AVB_VERSION }}
          
          *编译结果*:
          - avbtool: $(if [ -f "output/bin/avbtool" ]; then echo '✅ 成功'; else echo '❌ 失败'; fi)
          - avbctl: $(if [ -f "output/bin/avbctl" ]; then echo '✅ 成功'; else echo '❌ 失败'; fi)
          
          *工作流链接*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        format: markdown

    # 17. 构建总结
    - name: 构建总结
      if: always()
      run: |
        echo "## AOSP 环境 AVB 工具构建总结" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 环境信息" >> $GITHUB_STEP_SUMMARY
        echo "- **AOSP 版本**: ${{ env.AOSP_BRANCH }}" >> $GITHUB_STEP_SUMMARY
        echo "- **AVB 版本**: ${{ env.AVB_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **构建目标**: ${{ env.BUILD_TARGET }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 编译结果" >> $GITHUB_STEP_SUMMARY
        echo "| 工具 | 状态 | 说明 |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "output/bin/avbtool" ]; then
          echo "| avbtool | ✅ 成功 | AVB 镜像处理工具 |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| avbtool | ❌ 失败 | AVB 镜像处理工具 |" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f "output/bin/avbctl" ]; then
          echo "| avbctl | ✅ 成功 | AVB 控制工具 |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| avbctl | ❌ 失败 | AVB 控制工具 |" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ **AOSP 环境构建成功完成**" >> $GITHUB_STEP_SUMMARY
          echo "**制品文件**: avb-tools-aosp-${{ env.AVB_VERSION }}-${{ steps.create_package.outputs.DATE_STAMP }}.tar.gz" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **AOSP 环境构建失败**" >> $GITHUB_STEP_SUMMARY
          echo "请检查 AOSP 环境设置和依赖安装。" >> $GITHUB_STEP_SUMMARY
        fi