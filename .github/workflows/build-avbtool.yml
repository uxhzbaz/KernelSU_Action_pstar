name: 构建 AVB 工具

on:
  workflow_dispatch:  # 只支持手动触发
  push:
    branches:
      - main

env:
  AVB_VERSION: "android-16.0.0_r3"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: 检出仓库代码
      uses: actions/checkout@v4

    # 2. 安装系统依赖
    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3 \
          python3-pip \
          clang \
          g++ \
          cmake \
          pkg-config \
          libssl-dev

    # 3. 克隆 AVB 源码
    - name: 克隆 AVB 源码
      run: |
        git clone https://android.googlesource.com/platform/external/avb
        cd avb
        git checkout ${{ env.AVB_VERSION }}
        echo "AVB源码版本: ${{ env.AVB_VERSION }}"

    # 4. 编译 avbtool (Python 工具)
    - name: 编译 avbtool
      run: |
        cd avb
        
        # 检查 avbtool 是否存在
        if [ -f "avbtool.py" ]; then
          echo "找到 avbtool.py"
          
          # 安装 Python 依赖
          pip3 install cryptography
          
          # 测试 avbtool 是否正常工作
          python3 avbtool.py --version || echo "avbtool 版本检查跳过"
          
          # 创建输出目录
          mkdir -p ../output/bin
          cp avbtool.py ../output/bin/
          chmod +x ../output/bin/avbtool.py
          
          # 创建可直接执行的avbtool
          echo '#!/usr/bin/env python3' > ../output/bin/avbtool
          cat avbtool.py >> ../output/bin/avbtool
          chmod +x ../output/bin/avbtool
          
          echo "avbtool 编译完成"
        else
          echo "错误: 未找到 avbtool.py"
          exit 1
        fi

    # 5. 修复 avbctl 编译
    - name: 编译 avbctl
      continue-on-error: true
      run: |
        cd avb
        
        # 检查 avbctl 源码是否存在
        if [ -f "tools/avbctl/avbctl.cc" ]; then
          echo "找到 avbctl 源码"
          
          # 创建构建目录
          mkdir -p build
          cd build
          
          # 使用正确的编译命令格式
          g++ -std=c++17 \
            -I../libavb \
            -I../libavb_user \
            -o avbctl \
            ../tools/avbctl/avbctl.cc \
            ../libavb_user/avb_ops_user.cpp \
            ../libavb_user/avb_user_verification.c \
            ../libavb_user/avb_user_verity.c \
            -lssl -lcrypto -lpthread
          
          if [ -f "avbctl" ]; then
            # 复制到输出目录
            mkdir -p ../../output/bin
            cp avbctl ../../output/bin/
            chmod +x ../../output/bin/avbctl
            echo "avbctl 编译成功"
          else
            echo "警告: avbctl 编译失败，尝试使用 clang"
            # 尝试使用 clang
            clang++ -std=c++17 \
              -I../libavb \
              -I../libavb_user \
              -o avbctl \
              ../tools/avbctl/avbctl.cc \
              ../libavb_user/avb_ops_user.cpp \
              ../libavb_user/avb_user_verification.c \
              ../libavb_user/avb_user_verity.c \
              -lssl -lcrypto -lpthread
              
            if [ -f "avbctl" ]; then
              mkdir -p ../../output/bin
              cp avbctl ../../output/bin/
              chmod +x ../../output/bin/avbctl
              echo "avbctl 使用 clang 编译成功"
            else
              echo "错误: avbctl 编译失败"
            fi
          fi
        else
          echo "错误: 未找到 avbctl 源码"
        fi

    # 6. 验证编译结果
    - name: 验证编译结果
      run: |
        echo "编译结果:"
        echo "=========="
        
        if [ -f "output/bin/avbtool" ]; then
          echo "✅ avbtool - 编译成功"
          echo "文件位置: output/bin/avbtool"
          echo "文件大小: $(wc -c < output/bin/avbtool) 字节"
        else
          echo "❌ avbtool - 编译失败"
        fi
        
        if [ -f "output/bin/avbctl" ]; then
          echo "✅ avbctl - 编译成功"  
          echo "文件位置: output/bin/avbctl"
          echo "文件大小: $(wc -c < output/bin/avbctl) 字节"
        else
          echo "❌ avbctl - 编译失败"
        fi
        
        echo ""
        echo "输出目录内容:"
        find output/ -type f

    # 7. 打包工具
    - name: 打包工具
      run: |
        # 创建版本信息
        DATE_STAMP=$(date +%Y%m%d)
        mkdir -p output/
        
        cat > output/version.txt << EOF
        AVB Tools Build
        Version: ${{ env.AVB_VERSION }}
        Build Date: $(date)
        
        包含的工具:
        - avbtool: $(if [ -f "output/bin/avbtool" ]; then echo "成功"; else echo "失败"; fi)
        - avbctl: $(if [ -f "output/bin/avbctl" ]; then echo "成功"; else echo "失败"; fi)
        EOF
        
        # 打包
        tar -czf avb-tools-${{ env.AVB_VERSION }}-${DATE_STAMP}.tar.gz output/
        echo "打包完成: avb-tools-${{ env.AVB_VERSION }}-${DATE_STAMP}.tar.gz"

    # 8. 上传制品
    - name: 上传制品
      uses: actions/upload-artifact@v4
      with:
        name: avb-tools
        path: |
          output/
          avb-tools-*.tar.gz
        retention-days: 30