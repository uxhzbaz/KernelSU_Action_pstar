name: 构建 AVB 工具

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 时间 0 点运行
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - main

env:
  AVB_VERSION: "android-16.0.0_r3"
  CACHE_KEY: "avb-build-${{ github.sha }}"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: 检出仓库代码
      uses: actions/checkout@v4

    # 2. 设置缓存
    - name: 缓存编译环境
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          avb/ccache
        key: ${{ env.CACHE_KEY }}
        restore-keys: |
          avb-build-

    # 3. 安装系统依赖
    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3 \
          python3-pip \
          clang \
          llvm \
          libc++-dev \
          libc++abi-dev \
          ninja-build \
          cmake \
          pkg-config \
          libssl-dev \
          ccache \
          wget \
          curl \
          unzip

    # 4. 克隆 AVB 源码
    - name: 克隆 AVB 源码
      run: |
        git clone https://android.googlesource.com/platform/external/avb
        cd avb
        git checkout ${{ env.AVB_VERSION }}
        echo "AVB源码版本: ${{ env.AVB_VERSION }}" >> $GITHUB_STEP_SUMMARY

    # 5. 设置编译环境
    - name: 设置编译环境
      run: |
        export CC=clang
        export CXX=clang++
        export CFLAGS="-O2 -pipe"
        export CXXFLAGS="-O2 -pipe"
        
        # 创建构建目录
        mkdir -p avb/build
        mkdir -p avb/install

        echo "编译环境设置完成" >> $GITHUB_STEP_SUMMARY

    # 6. 编译 avbtool (Python 工具)
    - name: 编译 avbtool
      id: build_avbtool
      run: |
        cd avb
        
        # 检查 avbtool 是否存在
        if [ -f "avbtool.py" ]; then
          echo "找到 avbtool.py"
          
          # 安装 Python 依赖
          pip3 install cryptography
          
          # 测试 avbtool 是否正常工作
          python3 avbtool.py --version || true
          
          # 复制到安装目录
          mkdir -p install/bin
          cp avbtool.py install/bin/avbtool
          chmod +x install/bin/avbtool
          
          echo "avbtool 编译完成" >> $GITHUB_STEP_SUMMARY
          echo "avbtool_status=success" >> $GITHUB_OUTPUT
        else
          echo "错误: 未找到 avbtool.py"
          echo "avbtool_status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi

    # 7. 编译 avbctl
    - name: 编译 avbctl
      id: build_avbctl
      continue-on-error: true
      run: |
        cd avb
        
        # 检查 avbctl 源码是否存在
        if [ -f "tools/avbctl/avbctl.cc" ]; then
          echo "找到 avbctl 源码"
          
          # 创建构建目录
          mkdir -p build/avbctl
          cd build/avbctl
          
          # 尝试编译 avbctl
          $CXX -std=c++17 \
            -I../../libavb \
            -I../../libavb_user \
            -I/usr/include/android \
            -o avbctl \
            ../../tools/avbctl/avbctl.cc \
            ../../libavb_user/avb_ops_user.cpp \
            ../../libavb_user/avb_user_verification.c \
            ../../libavb_user/avb_user_verity.c \
            -lbase -landroid-properties -llog -lc++ -lc++abi
          
          if [ -f "avbctl" ]; then
            # 复制到安装目录
            mkdir -p ../../install/bin
            cp avbctl ../../install/bin/
            chmod +x ../../install/bin/avbctl
            echo "avbctl 编译成功" >> $GITHUB_STEP_SUMMARY
            echo "avbctl_status=success" >> $GITHUB_OUTPUT
          else
            echo "警告: avbctl 编译失败，跳过此工具"
            echo "avbctl_status=failed" >> $GITHUB_OUTPUT
          fi
        else
          echo "警告: 未找到 avbctl 源码"
          echo "avbctl_status=skipped" >> $GITHUB_OUTPUT
        fi

    # 8. 编译 libavb 库
    - name: 编译 libavb
      id: build_libavb
      continue-on-error: true
      run: |
        cd avb
        
        # 创建 libavb 构建目录
        mkdir -p build/libavb
        cd build/libavb
        
        # 尝试编译 libavb 静态库
        $CC -c -I../../libavb ../../libavb/avb_sha256.c -o avb_sha256.o
        $CC -c -I../../libavb ../../libavb/avb_rsa.c -o avb_rsa.o
        $CC -c -I../../libavb ../../libavb/avb_util.c -o avb_util.o
        $CC -c -I../../libavb ../../libavb/avb_crc32.c -o avb_crc32.o
        $CC -c -I../../libavb ../../libavb/avb_crypto.c -o avb_crypto.o
        
        # 创建静态库
        ar rcs libavb.a avb_sha256.o avb_rsa.o avb_util.o avb_crc32.o avb_crypto.o
        
        if [ -f "libavb.a" ]; then
          # 复制到安装目录
          mkdir -p ../../install/lib
          mkdir -p ../../install/include
          cp libavb.a ../../install/lib/
          cp ../../libavb/*.h ../../install/include/
          echo "libavb 编译成功" >> $GITHUB_STEP_SUMMARY
          echo "libavb_status=success" >> $GITHUB_OUTPUT
        else
          echo "警告: libavb 编译失败"
          echo "libavb_status=failed" >> $GITHUB_OUTPUT
        fi

    # 9. 创建安装包
    - name: 创建安装包
      run: |
        cd avb/install
        
        # 创建版本信息文件
        cat > version.txt << EOF
        AVB Tools Build
        Version: ${{ env.AVB_VERSION }}
        Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        Build SHA: ${{ github.sha }}
        
        包含的工具:
        - avbtool: ${{ steps.build_avbtool.outputs.avbtool_status }}
        - avbctl: ${{ steps.build_avbctl.outputs.avbctl_status }}
        - libavb: ${{ steps.build_libavb.outputs.libavb_status }}
        EOF
        
        # 创建 README
        cat > README.md << EOF
        # AVB Tools
        
        此包包含 Android Verified Boot (AVB) 工具。
        
        ## 包含内容
        
        - **avbtool**: Python 工具，用于处理 vbmeta 镜像
        - **avbctl**: C++ 工具，用于控制 AVB 设置
        - **libavb**: AVB 静态库和头文件
        
        ## 使用说明
        
        ### avbtool
        \`\`\`bash
        ./bin/avbtool --version
        ./bin/avbtool make_vbmeta_image --help
        \`\`\`
        
        ### avbctl
        \`\`\`bash
        ./bin/avbctl get-verity
        ./bin/avbctl get-verification
        \`\`\`
        
        ## 版本信息
        - AVB 版本: ${{ env.AVB_VERSION }}
        - 构建日期: $(date -u +"%Y-%m-%d")
        \EOF
        
        # 打包
        cd ..
        tar -czf ../avb-tools-${{ env.AVB_VERSION }}-$(date +%Y%m%d).tar.gz install/
        
        echo "安装包创建完成" >> $GITHUB_STEP_SUMMARY

    # 10. 上传制品
    - name: 上传制品
      uses: actions/upload-artifact@v4
      with:
        name: avb-tools-${{ env.AVB_VERSION }}
        path: avb-tools-${{ env.AVB_VERSION }}-*.tar.gz
        retention-days: 30

    # 11. 创建 Release
    - name: 创建 Release
      if: success()
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: avb-tools-${{ env.AVB_VERSION }}-$(date +%Y%m%d)
        name: AVB Tools ${{ env.AVB_VERSION }}
        body: |
          Android Verified Boot (AVB) 工具编译版本
          
          ## 版本信息
          - AVB 源码版本: ${{ env.AVB_VERSION }}
          - 构建日期: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - 包含工具状态:
            - ✅ avbtool: ${{ steps.build_avbtool.outputs.avbtool_status }}
            - 🔶 avbctl: ${{ steps.build_avbctl.outputs.avbctl_status }}
            - 🔶 libavb: ${{ steps.build_libavb.outputs.libavb_status }}
          
          ## 使用说明
          解压后请查看 README.md 文件了解详细使用方法。
        files: avb-tools-${{ env.AVB_VERSION }}-*.tar.gz
        draft: false
        prerelease: false

    # 12. 发送 Telegram 通知
    - name: 发送 Telegram 通知
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.CHAT_ID }}
        token: ${{ secrets.BOT_TOKEN }}
        message: |
          ${{ job.status == 'success' && '✅ *AVB 工具编译成功!*' || '❌ *AVB 工具编译失败!*' }}
          
          *版本*: ${{ env.AVB_VERSION }}
          *构建结果*:
          - avbtool: ${{ steps.build_avbtool.outputs.avbtool_status }}
          - avbctl: ${{ steps.build_avbctl.outputs.avbctl_status }}
          - libavb: ${{ steps.build_libavb.outputs.libavb_status }}
          
          *工作流链接*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          *提交*: ${{ github.sha }}
        format: markdown

    # 13. 构建总结
    - name: 构建总结
      if: always()
      run: |
        echo "## 构建总结" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 组件 | 状态 | 说明 |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| avbtool | ${{ steps.build_avbtool.outputs.avbtool_status }} | Python vbmeta 工具 |" >> $GITHUB_STEP_SUMMARY
        echo "| avbctl | ${{ steps.build_avbctl.outputs.avbctl_status }} | AVB 控制工具 |" >> $GITHUB_STEP_SUMMARY
        echo "| libavb | ${{ steps.build_libavb.outputs.libavb_status }} | AVB 静态库 |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**制品文件**: avb-tools-${{ env.AVB_VERSION }}-*.tar.gz" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ **构建成功完成**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **构建失败**" >> $GITHUB_STEP_SUMMARY
        fi