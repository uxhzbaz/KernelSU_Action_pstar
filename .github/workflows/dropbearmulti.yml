name: Static Dropbearmulti for Android ARM64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DROPBEAR_VERSION: DROPBEAR_2025.88

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip

    - name: Download Android NDK
      run: wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip

    - name: Extract NDK
      run: unzip -q android-ndk-r25b-linux.zip

    - name: Download Dropbear
      run: wget -q "https://github.com/mkj/dropbear/archive/refs/tags/$DROPBEAR_VERSION.tar.gz" -O dropbear.tar.gz

    - name: Extract Dropbear
      run: tar -xzf dropbear.tar.gz

    - name: Set environment variables
      run: |
        echo "DROPBEAR_SRC_DIR=dropbear-$DROPBEAR_VERSION" >> $GITHUB_ENV
        echo "TOOLCHAIN=$(pwd)/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

    - name: Configure Dropbear
      run: |
        cd "$DROPBEAR_SRC_DIR"
        # 创建 localoptions.h 来禁用密码认证，避免 crypt() 依赖
        cat > localoptions.h << 'EOF'
#ifndef LOCALOPTIONS_H_
#define LOCALOPTIONS_H_

/* 禁用密码认证以避免 crypt() 依赖 */
#define DROPBEAR_SVR_PASSWORD_AUTH 0

/* 启用多二进制编译 */
#define DROPBEAR_MULTI 1

/* 定义要编译的程序 */
#define DROPBEAR_DROPBEAR 1
#define DROPBEAR_DBCLIENT 1
#define DROPBEAR_DROPBEARKEY 1
#define DROPBEAR_DROPBEARCONVERT 1
#define DROPBEAR_SCP 1

/* 禁用不必要功能以减少依赖 */
#ifndef DISABLE_ZLIB
#define DISABLE_ZLIB 1
#endif

/* 禁用系统日志 */
#ifndef DISABLE_SYSLOG
#define DISABLE_SYSLOG 1
#endif

#endif /* LOCALOPTIONS_H_ */
EOF

        # 配置编译参数
        CC="$TOOLCHAIN/aarch64-linux-android31-clang" \
        CFLAGS="-Os -static -DNO_GETRANDOM -D_GNU_SOURCE" \
        LDFLAGS="-static" \
        ./configure \
          --host=aarch64-linux-android \
          --enable-static \
          --disable-shared \
          --disable-syslog \
          --disable-zlib \
          --disable-harden

    - name: Build Dropbear
      run: |
        cd "$DROPBEAR_SRC_DIR"
        make PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp" MULTI=1

    - name: Verify binary
      run: |
        cd "$DROPBEAR_SRC_DIR"
        file dropbearmulti
        ls -la dropbearmulti

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dropbearmulti-android-arm64
        path: dropbear-$DROPBEAR_VERSION/dropbearmulti
        retention-days: 30

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dropbear-$DROPBEAR_VERSION/dropbearmulti
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}