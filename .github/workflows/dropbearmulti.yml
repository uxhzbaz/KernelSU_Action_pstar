name: Build Static Dropbearmulti for Android ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'dropbear-*'

env:
  DROPBEAR_VERSION: "DROPBEAR_2025.88"
  TARGET_ARCH: "aarch64-linux-android"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ env.TARGET_ARCH }}-${{ env.DROPBEAR_VERSION }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ env.TARGET_ARCH }}-
          ${{ runner.os }}-ccache-

    - name: Download Dropbear source
      run: |
        wget -q "https://github.com/mkj/dropbear/archive/refs/tags/$DROPBEAR_VERSION.tar.gz" -O dropbear.tar.gz
        tar -xzf dropbear.tar.gz
        echo "DROPBEAR_SRC_DIR=dropbear-${DROPBEAR_VERSION}" >> $GITHUB_ENV

    - name: Apply Termux patches
      run: |
        cd "$DROPBEAR_SRC_DIR"
        # Apply the same patches that worked in Termux
        sed -i 's/#ifdef HAVE_GETRANDOM/#if 0/' src/dbrandom.c
        sed -i 's/fexecve(execfd, new_argv, environ);/execve(new_argv[0], new_argv, environ);/' src/svr-main.c

    - name: Create localoptions.h to disable password auth
      run: |
        cd "$DROPBEAR_SRC_DIR"
        cat > localoptions.h << 'EOF'
#ifndef DROPBEAR_LOCALOPTIONS_H_
#define DROPBEAR_LOCALOPTIONS_H_

/* Disable server password authentication since crypt() is not available */
#define DROPBEAR_SVR_PASSWORD_AUTH 0

/* Disable client password authentication since getpass() is not available */
#define DROPBEAR_CLIENT_PASSWORD_AUTH 0

/* Enable only public key authentication */
#define DROPBEAR_SVR_PUBKEY_AUTH 1
#define DROPBEAR_CLIENT_PUBKEY_AUTH 1

/* Enable multi-binary compilation */
#define DROPBEAR_MULTI 1

/* Disable features that cause issues on Android */
#define DROPBEAR_SYSLOG 0
#define DROPBEAR_USE_PASSWORD_ENV 0

#endif /* DROPBEAR_LOCALOPTIONS_H_ */
EOF

    - name: Configure and compile Dropbear
      run: |
        cd "$DROPBEAR_SRC_DIR"
        export TOOLCHAIN="$(pwd)/../android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export CC="$TOOLCHAIN/${TARGET_ARCH}31-clang"
        export AR="$TOOLCHAIN/llvm-ar"
        export RANLIB="$TOOLCHAIN/llvm-ranlib"
        export STRIP="$TOOLCHAIN/llvm-strip"
        
        # Use the exact CFLAGS that worked in Termux
        export CFLAGS="-DNO_GETRANDOM -D_GNU_SOURCE -Wundef -fno-strict-overflow -Wno-pointer-sign"
        export LDFLAGS="-static -lz"
        
        # Clean first
        make clean
        
        # Configure with minimal options, let localoptions.h handle the rest
        ./configure \
          --host=$TARGET_ARCH \
          --enable-static \
          --disable-harden \
          --disable-syslog \
          --disable-lastlog \
          --disable-utmp \
          --disable-utmpx \
          --disable-wtmp \
          --disable-wtmpx \
          --disable-pam \
          --disable-shadow \
          --with-zlib=no

        # Compile with the same flags as Termux
        make PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp" MULTI=1

    - name: Strip binary and verify
      run: |
        cd "$DROPBEAR_SRC_DIR"
        $STRIP --strip-all dropbearmulti
        file dropbearmulti
        # Test that the binary works
        ./dropbearmulti --help || echo "Binary built successfully"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dropbearmulti-static-android-arm64
        path: ${{ env.DROPBEAR_SRC_DIR }}/dropbearmulti