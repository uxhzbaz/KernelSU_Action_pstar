name: Build Dropbear for Android ARM64

on:
  workflow_dispatch:
  push:
    tags: ['dropbear-*']

env:
  DROPBEAR_VERSION: "DROPBEAR_2025.88"
  TARGET_ARCH: "aarch64-linux-android"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip

    - name: Download Dropbear source
      run: |
        wget -q "https://github.com/mkj/dropbear/archive/refs/tags/$DROPBEAR_VERSION.tar.gz" -O dropbear.tar.gz
        tar -xzf dropbear.tar.gz
        echo "DROPBEAR_SRC_DIR=dropbear-${DROPBEAR_VERSION}" >> $GITHUB_ENV

    - name: Setup environment and apply patches
      run: |
        cd "$DROPBEAR_SRC_DIR"
        export TOOLCHAIN="$(pwd)/../android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export CC="$TOOLCHAIN/${TARGET_ARCH}31-clang"
        export AR="$TOOLCHAIN/llvm-ar"
        export RANLIB="$TOOLCHAIN/llvm-ranlib"
        export STRIP="$TOOLCHAIN/llvm-strip"
        
        # 应用补丁修复Android兼容性问题[citation:9]
        sed -i 's/#ifdef HAVE_GETRANDOM/#if 0/' src/dbrandom.c
        sed -i 's/fexecve(execfd, new_argv, environ);/execve(new_argv[0], new_argv, environ);/' src/svr-main.c
        
        # 创建localoptions.h禁用密码认证[citation:9]
        echo "#define DROPBEAR_SVR_PASSWORD_AUTH 0" > localoptions.h
        echo "#define DROPBEAR_CLIENT_PASSWORD_AUTH 0" >> localoptions.h

    - name: Attempt static build
      id: static_build
      continue-on-error: true
      run: |
        cd "$DROPBEAR_SRC_DIR"
        export TOOLCHAIN="$(pwd)/../android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export CC="$TOOLCHAIN/${TARGET_ARCH}31-clang"
        
        # 静态编译配置[citation:9]
        export CFLAGS="-DNO_GETRANDOM -D_GNU_SOURCE -DHAVE_CRYPT=0 -DHAVE_GETPASS=0"
        export LDFLAGS="-static"
        
        ./configure \
          --host=$TARGET_ARCH \
          --enable-static \
          --disable-harden \
          --disable-syslog \
          --disable-lastlog \
          --disable-utmp \
          --disable-utmpx \
          --disable-wtmp \
          --disable-wtmpx \
          --disable-pam \
          --disable-shadow \
          --disable-zlib
        
        make PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp" MULTI=1
        
        # 验证静态二进制文件
        file dropbearmulti | grep "statically linked" && echo "STATIC_BUILD=true" >> $GITHUB_OUTPUT

    - name: Dynamic build fallback
      if: steps.static_build.outputs.STATIC_BUILD != 'true'
      run: |
        cd "$DROPBEAR_SRC_DIR"
        make clean
        
        export TOOLCHAIN="$(pwd)/../android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export CC="$TOOLCHAIN/${TARGET_ARCH}31-clang"
        
        # 动态编译配置
        export CFLAGS="-DNO_GETRANDOM -D_GNU_SOURCE -DHAVE_CRYPT=0 -DHAVE_GETPASS=0"
        export LDFLAGS="-Wl,-rpath=/system/lib64"
        
        ./configure \
          --host=$TARGET_ARCH \
          --disable-harden \
          --disable-syslog \
          --disable-lastlog \
          --disable-utmp \
          --disable-utmpx \
          --disable-wtmp \
          --disable-wtmpx \
          --disable-pam \
          --disable-shadow \
          --disable-zlib
        
        make PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp" MULTI=1

    - name: Extract dynamic dependencies
      if: steps.static_build.outputs.STATIC_BUILD != 'true'
      run: |
        cd "$DROPBEAR_SRC_DIR"
        mkdir -p dropbear-libs
        
        # 提取依赖库[citation:9]
        $TOOLCHAIN/llvm-readelf -d dropbearmulti | grep "Shared library" | awk '{print $5}' | tr -d '[]' > libs.txt
        
        # 复制所需的动态库
        for lib in $(cat libs.txt); do
          find ../android-ndk-r25b -name "$lib" -exec cp {} dropbear-libs/ \;
        done
        
        # 复制二进制文件
        cp dropbearmulti dropbear-libs/

    - name: Prepare artifacts
      run: |
        cd "$DROPBEAR_SRC_DIR"
        
        if [ -f dropbearmulti ] && [ "${{ steps.static_build.outputs.STATIC_BUILD }}" = "true" ]; then
          $STRIP --strip-all dropbearmulti
          mkdir -p artifacts
          mv dropbearmulti artifacts/
          echo "BUILD_TYPE=static" >> $GITHUB_ENV
        elif [ -d dropbear-libs ]; then
          mkdir -p artifacts
          cp -r dropbear-libs/* artifacts/
          echo "BUILD_TYPE=dynamic" >> $GITHUB_ENV
        else
          echo "Build failed"
          exit 1
        fi
        
        # 验证二进制文件
        file artifacts/dropbearmulti

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dropbear-${{ env.BUILD_TYPE }}-android-arm64
        path: ${{ env.DROPBEAR_SRC_DIR }}/artifacts/