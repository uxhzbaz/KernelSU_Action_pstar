name: Static Dropbearmulti for Android ARM64

on:
  workflow_dispatch: # 允许手动触发
  push:
    tags: # 在推送特定标签时触发，例如 'dropbear-*'
      - 'dropbear-*'

env:
  DROPBEAR_VERSION: "DROPBEAR_2025.88" # 定义要使用的 Dropbear 版本
  TARGET_ARCH: "aarch64-linux-android" # 目标架构

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          echo "$(pwd)/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ env.TARGET_ARCH }}-${{ env.DROPBEAR_VERSION }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.TARGET_ARCH }}-
            ${{ runner.os }}-ccache-

      - name: Download Dropbear source
        run: |
          wget -q "https://github.com/mkj/dropbear/archive/refs/tags/$DROPBEAR_VERSION.tar.gz" -O dropbear.tar.gz
          tar -xzf dropbear.tar.gz
          echo "DROPBEAR_SRC_DIR=dropbear-${DROPBEAR_VERSION}" >> $GITHUB_ENV

      - name: Setup environment and compiler
        run: |
          export TOOLCHAIN="$(pwd)/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/${TARGET_ARCH}31-clang"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export STRIP="$TOOLCHAIN/llvm-strip"

          echo "CC=$CC" >> $GITHUB_ENV
          echo "AR=$AR" >> $GITHUB_ENV
          echo "RANLIB=$RANLIB" >> $GITHUB_ENV
          echo "STRIP=$STRIP" >> $GITHUB_ENV

          # 设置 ccache 包装的编译器以加速后续编译
          export CC="ccache $CC"
          echo "CCACHE_ENABLED=$CC" >> $GITHUB_ENV

      - name: Configure and compile Dropbear
        run: |
          cd "$DROPBEAR_SRC_DIR"

          # 静态链接配置，禁用共享库以减少依赖和体积[citation:2]
          ./configure --host=$TARGET_ARCH \
            --enable-static \
            --disable-shared \
            --disable-syslog \
            --disable-lastlog \
            --disable-utmp \
            --disable-utmpx \
            --disable-wtmp \
            --disable-wtmpx \
            MULTI=1 \
            PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp"

          make -j$(nproc) PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp" MULTI=1

      - name: Strip binary
        run: |
          cd "$DROPBEAR_SRC_DIR"
          $STRIP --strip-all dropbearmulti

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbearmulti-static-android-arm64
          path: ${{ env.DROPBEAR_SRC_DIR }}/dropbearmulti