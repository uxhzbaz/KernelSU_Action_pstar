name: Build Static Dropbearmulti for Android ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'dropbear-*'

env:
  DROPBEAR_VERSION: "DROPBEAR_2025.88"
  TARGET_ARCH: "aarch64-linux-android"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ env.TARGET_ARCH }}-${{ env.DROPBEAR_VERSION }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ env.TARGET_ARCH }}-
          ${{ runner.os }}-ccache-

    - name: Download Dropbear source
      run: |
        wget -q "https://github.com/mkj/dropbear/archive/refs/tags/$DROPBEAR_VERSION.tar.gz" -O dropbear.tar.gz
        tar -xzf dropbear.tar.gz
        echo "DROPBEAR_SRC_DIR=dropbear-${DROPBEAR_VERSION}" >> $GITHUB_ENV

    - name: Configure Dropbear
      run: |
        cd "$DROPBEAR_SRC_DIR"
        export TOOLCHAIN="$(pwd)/../android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export CC="$TOOLCHAIN/${TARGET_ARCH}31-clang"
        export AR="$TOOLCHAIN/llvm-ar"
        export RANLIB="$TOOLCHAIN/llvm-ranlib"
        export STRIP="$TOOLCHAIN/llvm-strip"
        export CFLAGS="-Wno-undef -DNO_GETRANDOM -D_GNU_SOURCE"
        
        ./configure --host=$TARGET_ARCH \
          --enable-static \
          --disable-harden \
          --disable-syslog \
          --disable-lastlog \
          --disable-utmp \
          --disable-utmpx \
          --disable-wtmp \
          --disable-wtmpx \
          --disable-pam \
          --disable-shared \
          --disable-svr-password-auth \
          --disable-cli-password-auth

    - name: Compile Dropbear
      run: |
        cd "$DROPBEAR_SRC_DIR"
        export TOOLCHAIN="$(pwd)/../android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export CC="$TOOLCHAIN/${TARGET_ARCH}31-clang"
        
        # 设置编译标志来避免getpass和相关错误
        export CFLAGS="$CFLAGS -DHAVE_CRYPT=0 -DHAVE_GETPASS=0"
        
        make PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp" MULTI=1

    - name: Strip binary and verify
      run: |
        cd "$DROPBEAR_SRC_DIR"
        $TOOLCHAIN/llvm-strip --strip-all dropbearmulti
        file dropbearmulti

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dropbearmulti-static-android-arm64
        path: ${{ env.DROPBEAR_SRC_DIR }}/dropbearmulti