name: Build Static Dropbearmulti for Android ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'dropbear-*'

env:
  DROPBEAR_VERSION: "DROPBEAR_2025.88"
  TARGET_ARCH: "aarch64-linux-android"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ env.TARGET_ARCH }}-${{ env.DROPBEAR_VERSION }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ env.TARGET_ARCH }}-
          ${{ runner.os }}-ccache-

    - name: Download Dropbear source
      run: |
        wget -q "https://github.com/mkj/dropbear/archive/refs/tags/$DROPBEAR_VERSION.tar.gz" -O dropbear.tar.gz
        tar -xzf dropbear.tar.gz
        echo "DROPBEAR_SRC_DIR=dropbear-${DROPBEAR_VERSION}" >> $GITHUB_ENV

    - name: Create custom localoptions.h
      run: |
        cd "$DROPBEAR_SRC_DIR"
        cat > localoptions.h << 'EOF'
#ifndef LOCALOPTIONS_H_
#define LOCALOPTIONS_H_

/* Override system detection for crypt and getpass */
#define HAVE_CRYPT 0
#define HAVE_GETPASS 0

/* Disable server password authentication */
#define DROPBEAR_SVR_PASSWORD_AUTH 0

/* Disable client password authentication */
#define DROPBEAR_CLI_PASSWORD_AUTH 0

/* Disable PAM */
#define DROPBEAR_SVR_PAM_AUTH 0

/* Enable only public key auth for client */
#define DROPBEAR_CLI_PUBKEY_AUTH 1

/* Enable server public key auth */
#define DROPBEAR_SVR_PUBKEY_AUTH 1

/* Disable other authentication methods */
#define DROPBEAR_CLI_INTERACT_AUTH 0

/* Programs to include in multi-binary */
#define DROPBEAR_MULTI 1

/* Disable features not available on Android */
#define DROPBEAR_SYSLOG 0
#define USE_DEV_PTMX 1

#endif /* LOCALOPTIONS_H_ */
EOF

    - name: Configure and compile Dropbear
      run: |
        cd "$DROPBEAR_SRC_DIR"
        export TOOLCHAIN="$(pwd)/../android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export CC="$TOOLCHAIN/${TARGET_ARCH}31-clang"
        export AR="$TOOLCHAIN/llvm-ar"
        export RANLIB="$TOOLCHAIN/llvm-ranlib"
        export STRIP="$TOOLCHAIN/llvm-strip"
        
        # 设置编译标志来解决Android NDK兼容性问题
        export CFLAGS="-DNO_GETRANDOM -D_GNU_SOURCE -DHAVE_CRYPT=0 -DHAVE_GETPASS=0"
        export LDFLAGS="-static -lz -lcrypt"
        
        # 配置Dropbear，禁用不兼容的功能
        ./configure \
          --host=$TARGET_ARCH \
          --enable-static \
          --disable-harden \
          --disable-syslog \
          --disable-lastlog \
          --disable-utmp \
          --disable-utmpx \
          --disable-wtmp \
          --disable-wtmpx \
          --disable-pam \
          --disable-shadow \
          --with-zlib=no
        
        # 编译多合一二进制文件
        make PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp" MULTI=1

    - name: Strip binary and verify
      run: |
        cd "$DROPBEAR_SRC_DIR"
        $STRIP --strip-all dropbearmulti
        file dropbearmulti
        # 测试二进制文件是否可运行
        ./dropbearmulti --help || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dropbearmulti-static-android-arm64
        path: ${{ env.DROPBEAR_SRC_DIR }}/dropbearmulti